# Complete deterministic performance-path covering matrix for the single
# parameterized cuDNN Frontend block-scaled GEMM+SwiGLU interleaved-quant port.
kernel: cudnn_sm100_dense_blockscaled_gemm_persistent_swiglu_interleaved_quant
selection_rationale: The selected defaults span small/medium/large square GEMMs while the complete 234-row matrix covers 31 legal performance representatives, 1024/2048/4096/8192 square shapes for executable N tiles 64/128/256, L=1/2 where executable, all supported input/scale/output dtypes, major modes, one-CTA/two-CTA paths, clusters, vector/scalar FP32 conversion, SFC, amax, TMA/MMA/store paths, and every actual stage tuple. N-tile 192 remains correctness-only at its source-correct N=192 boundary because the standalone source leaves AB12 columns unwritten at the proposed 3072 performance shape.
