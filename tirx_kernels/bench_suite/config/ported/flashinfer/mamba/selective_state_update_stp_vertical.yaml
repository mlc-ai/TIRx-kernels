# Complete source-comparable STP vertical sweep.  DIM=64/128 is the reviewed
# vertical dispatch domain; nullable-D and small-batch aliases stay correctness-only.
# The pinned sweep keeps the base plus larger-dim and larger-state points;
# the remaining dispatch and dtype variants stay benchable on request.
kernel: selective_state_update_stp_vertical
selection_rationale: The base shape plus larger-dimension and larger-state shapes cover the reviewed vertical dispatch domain and its main work-scaling axes.
