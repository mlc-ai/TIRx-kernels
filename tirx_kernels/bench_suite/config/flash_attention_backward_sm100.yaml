# Two-CTA SM100 FlashAttention backward, D=128, 16 heads.
#
# These rows were held out of the pinned sweep for a while because the reference
# they bench against, flash_attn.cute's backward, deadlocked on this host:
# cutlass-dsl 4.6.1 compiled FlashAttentionBackwardSm100 into a kernel whose
# warps sat in mbarrier try_wait spin loops forever, so the sweep and the
# registry correctness manifest hung instead of failing. cutlass-dsl 4.6.0.dev0
# compiles it correctly and the reference returns in ~4s, so the rows are back.
kernel: flash_attention_backward_sm100
configs:
  - {config: b1_s2048_h16_causal, default: true}
  - {config: b1_s4096_h16_causal, default: true}
  - {config: b2_s4096_h16_causal, default: true}
  - {config: b1_s8192_h16_causal, default: true}
  - {config: b1_s8192_h16_noncausal, default: true}
  # flash-attn's default benchmark_attn.py shape: hd128, s8192, 32k total
  # tokens (batch 4), 16 heads, causal and non-causal.
  - {config: b4_s8192_h16_causal, default: true}
  - {config: b4_s8192_h16_noncausal, default: true}
