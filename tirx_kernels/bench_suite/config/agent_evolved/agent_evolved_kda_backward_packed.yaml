kernel: agent_evolved_kda_backward_packed
selection_rationale: The seventeen official workloads split into two dispatch paths, so the defaults cover both and bracket the cost range - the H=96 whole-chunk row is the only one that takes the fused chain kernel and is also the most expensive, while the two portfolio defaults take the megakernel and span its extremes (Hqk=4/Hv=8 over 32768 tokens is the largest, Hqk=2/Hv=4 over 18432 tokens the smallest).
