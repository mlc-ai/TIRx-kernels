kernel: agent_evolved_mla_dsv4_multishape
selection_rationale: The ninety-four official rows cover decode and prefill, varlen and dense query packing, bf16 and fp8 storage, HND and NHD pools, and rows with and without a compressed pool. The defaults bracket that range - the two H=128 prefill rows are the most expensive and exercise the M=64 layout-E path in both dtypes, and the smallest SWA-only decode row exercises the M=32 layout-G path with no compressed pool. The remaining rows share those programs and stay available but off by default so one suite run does not time all ninety-four.
