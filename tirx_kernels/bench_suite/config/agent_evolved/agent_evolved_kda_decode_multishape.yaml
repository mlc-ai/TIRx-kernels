kernel: agent_evolved_kda_decode_multishape
selection_rationale: The thirty official rows split across four dispatch routes, so the defaults cover each one and bracket the cost range - T=1/N=128 is the largest standard-decode row and the only default on the CLC unit ring, T=4/N=128 is the largest row on the dynamic ticket scheduler, T=6/N=128 is the most expensive row overall and the only one on the deferred-publication path, and T=3/N=1 is the smallest row and the only default with the runtime lower-bound gate at HV=16. The remaining rows share those four programs and stay available but off by default.
configs:
