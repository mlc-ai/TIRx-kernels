# FlashInfer MTP simple: official batch/T/state sweep plus compile-shape and
# execution-body guards.  Every row uses algorithm="simple" in the reference.
# The pinned sweep keeps four points of the official batch curve
# (b1/b64/b512/b2048, BF16 state); the rest stay benchable on request.
kernel: selective_state_update_mtp_simple
configs:
  - {config: b1_h64_d64_s128_t6_r8_statebf16_official, default: true}
  - {config: b2_h64_d64_s128_t6_r8_statebf16_official, default: false}
