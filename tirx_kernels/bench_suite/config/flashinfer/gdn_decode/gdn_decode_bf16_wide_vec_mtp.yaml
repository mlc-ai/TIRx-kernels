# Complete SM100 BF16 wide-vector MTP production dispatch matrix for
# Qwen3-Next TP1/2/4/8 and T=2/4/8. Every row is required by the port's
# performance gate.
kernel: gdn_decode_bf16_wide_vec_mtp
selection_rationale: Total token-value-head work grows from 256 through 4096 to 131072 while the points span T=2/4/8, TP1/2 head regimes, and tile_v 32/128; every other dispatch row remains explicitly runnable.
