# Every config the SINGLE_CTA=false dispatch domain reaches: all 18
# dtype x mode x deterministic cells across every ctas_per_group regime the
# launcher produces (minimal 2-CTA groups, an odd division with a tail CTA, and
# the large 262144/524288 row extents the upstream benchmark sweeps), every
# reachable VEC_SIZE, the k sweep through 4096, all four group topologies, and
# every runtime pointer branch.  The performance gate requires every entry here
# to beat 0.99x the FlashInfer source, so the list is the full domain rather
# than a curated subset; the three `default: true` rows are only the
# representatives carried into the repository-wide default sweep.
#
# Trivial-branch, short-row and workspace-reuse configs are correctness cases
# only -- they bypass the radix path or launch twice -- so they stay out of the
# timed matrix.
kernel: radix_topk_multi_cta
selection_rationale: The fp32 Basic column is the base dispatch; l57596 is the smallest row the launcher splits across two CTAs, l115188 adds a third CTA with an uneven tail chunk, and l524288 is the widest group (10 CTAs) the upstream benchmark reaches.
