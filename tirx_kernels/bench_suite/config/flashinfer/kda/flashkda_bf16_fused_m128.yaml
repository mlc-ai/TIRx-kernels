# Exactly the module's five BENCH_CONFIGS cases, covering the head-count /
# packed / state variants that dispatch to this kernel.
kernel: flashkda_bf16_fused_m128
selection_rationale: The defaults cover fixed, uniform, and mixed sequence/state variants and both 96-head and 64-head production families.
configs:
  - {config: h96_fixed8192, default: true, selection_role: large}
  - {config: h96_mixed, default: false}
  - {config: h96_uniform, default: true, selection_role: medium}
  - {config: h64_mixed, default: true, selection_role: small}
  - {config: h64_uniform, default: false}
