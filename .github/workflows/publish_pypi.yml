name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Existing release tag to publish (for example, v0.1.0rc0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build_wheels.yml
    with:
      ref: refs/tags/${{ github.event.release.tag_name || inputs.ref }}
      expected_version: ${{ github.event.release.tag_name || inputs.ref }}

  upload_pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/tirx-kernels
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: ${{ secrets.PYPI_API_TOKEN == '' }}
          verbose: false
